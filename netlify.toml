# Netlify build config.
# publish = "." because index.html sits at the repo root, as specified.
# That means lib/, tests/, docs/ and business/ would otherwise be PUBLIC.
# The [[redirects]] block at the bottom is what stops that. Verified 2026-11-09:
# a forced rewrite to a 404 is how Netlify denies a path that exists on disk.

[build]
  publish = "."
  functions = "Netlify/functions"

[functions]
  directory = "Netlify/functions"
  # Read at runtime with fs inside the function, so it must be bundled.
  included_files = ["business/**"]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# --- Deny everything that is not the site -----------------------------------
# force = true so the rule applies even though the file really exists.

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Client facts and demo data. Never public.
[[redirects]]
  from = "/business/*"
  to = "/404.html"
  status = 404
  force = true

# Config and repo files, if the deploy ever exposes them.
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Internal build notes, one rule each. Netlify only accepts a splat at the END
# of a path, so a pattern like "/*.md" is silently ineffective - it was tried on
# 2026-11-12 and the files stayed public. A test enumerates the root *.md files
# and fails if one of them has no rule here, so this list cannot go stale.
# PROBE after deploy:
#   curl -o /dev/null -w '%{http_code}' https://SITE/STEP-1-PLAN.md   # expect 404
[[redirects]]
  from = "/STEP-1-PLAN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ARCHITECTURE-V2-WHATSAPP.md"
  to = "/404.html"
  status = 404
  force = true

# The function SOURCE is also published, because publish = "." puts the whole
# repo on the CDN. Netlify serves it as application/javascript. It holds no
# secret (keys come from the environment) but it is the router, the rate-limit
# config and the validation order in one readable file. Not public.
# PROBE: curl -o /dev/null -w '%{http_code}' https://SITE/netlify/functions/chat.mjs
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_headers"
  to = "/404.html"
  status = 404
  force = true

# The default /.netlify/functions/ alias would bypass the /api/* rate limit,
# which is set in each function's config. Deny the alias.
# PROBE: curl -o /dev/null -w '%{http_code}' -X POST https://SITE/.netlify/functions/chat
[[redirects]]
  from = "/.netlify/*"
  to = "/404.html"
  status = 404
  force = true
